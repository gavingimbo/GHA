<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;

      --brand: #592a7d;
      --brand-deep: #300b5c;
      --brand-tint: rgba(89, 42, 125, 0.08);

      --danger: #b31b1b;

      --page: #f7f4f8;
      --surface: #ffffff;
      --text: #1a1520;
      --muted: #6b6572;
      --placeholder: #a49daa;
      --line: #e6e1e9;
      --line-strong: #d5cede;

      --radius-card: 22px;
      --radius-field: 12px;

      --ring: 0 0 0 4px rgba(89, 42, 125, 0.13);
      --ring-danger: 0 0 0 4px rgba(179, 27, 27, 0.11);

      --shadow-card:
        0 1px 2px rgba(48, 11, 92, 0.04),
        0 10px 24px -12px rgba(48, 11, 92, 0.14),
        0 40px 72px -40px rgba(48, 11, 92, 0.22);
      --shadow-mark: 0 4px 14px -6px rgba(48, 11, 92, 0.28);
      --shadow-action: 0 8px 20px -10px rgba(89, 42, 125, 0.65);

      --ease: cubic-bezier(0.32, 0.72, 0, 1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: var(--page);
      background-image:
        radial-gradient(120% 80% at 12% -10%, rgba(89, 42, 125, 0.10), transparent 62%),
        radial-gradient(90% 70% at 100% 0%, rgba(48, 11, 92, 0.07), transparent 58%),
        radial-gradient(120% 90% at 50% 118%, rgba(89, 42, 125, 0.07), transparent 60%);
      background-attachment: fixed;
      color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      letter-spacing: -0.006em;
    }

    button,
    input,
    a {
      font: inherit;
      letter-spacing: inherit;
    }

    ::selection {
      background: rgba(89, 42, 125, 0.16);
    }

    .screen {
      min-height: 100vh;
      min-height: 100svh;
      width: 100%;
    }

    /* ---------- Sign in ---------- */

    .login-screen {
      align-items: center;
      display: grid;
      justify-items: center;
      padding: clamp(20px, 5vw, 56px) clamp(16px, 5vw, 32px);
    }

    .login-screen[hidden] {
      display: none;
    }

    .card {
      animation: rise 620ms var(--ease) both;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      overflow: hidden;
      padding: clamp(26px, 4.4vw, 40px) clamp(22px, 4.4vw, 44px) clamp(28px, 4.4vw, 40px);
      position: relative;
      width: min(100%, 452px);
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.988);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    .topline {
      align-items: center;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      margin-bottom: clamp(24px, 3.6vw, 32px);
    }

    .mark {
      align-items: center;
      background: radial-gradient(115% 115% at 30% 12%, #7a44a6, var(--brand-deep) 72%);
      border-radius: 50%;
      box-shadow: var(--shadow-mark), inset 0 1px 0 rgba(255, 255, 255, 0.24);
      color: #ffffff;
      display: inline-flex;
      font-size: 26px;
      font-weight: 600;
      grid-column: 2;
      height: 52px;
      justify-content: center;
      justify-self: center;
      line-height: 1;
      width: 52px;
    }

    .mark span {
      display: block;
      transform: translateY(-0.5px);
    }

    .close-button {
      align-items: center;
      appearance: none;
      background: transparent;
      border: 0;
      border-radius: 50%;
      color: var(--muted);
      cursor: pointer;
      display: inline-flex;
      grid-column: 3;
      height: 36px;
      justify-content: center;
      justify-self: end;
      padding: 0;
      transition: background 180ms var(--ease), color 180ms var(--ease);
      width: 36px;
    }

    .close-button svg {
      height: 17px;
      width: 17px;
    }

    .close-button:hover {
      background: var(--brand-tint);
      color: var(--brand-deep);
    }

    .heading {
      margin-bottom: clamp(22px, 3.4vw, 30px);
      text-align: center;
    }

    h1 {
      color: var(--brand-deep);
      font-size: clamp(21px, 2.6vw, 24px);
      font-weight: 700;
      letter-spacing: 0.1em;
      line-height: 1.15;
      margin: 0;
      text-transform: uppercase;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14.5px;
      line-height: 1.45;
      margin: 10px 0 0;
    }

    .field-group {
      margin: 0 0 18px;
    }

    .field-group:last-of-type {
      margin-bottom: 0;
    }

    .field-row {
      align-items: baseline;
      display: flex;
      gap: 12px;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    label {
      color: #2c2434;
      display: block;
      font-size: 13.5px;
      font-weight: 500;
      letter-spacing: 0;
      line-height: 1.3;
    }

    .required {
      color: var(--danger);
      margin-left: 1px;
    }

    .input-wrap {
      position: relative;
    }

    input {
      background: #fcfbfd;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-field);
      color: var(--text);
      display: block;
      font-size: 15px;
      height: 50px;
      outline: 0;
      padding: 0 16px;
      transition: border-color 180ms var(--ease), box-shadow 180ms var(--ease), background 180ms var(--ease);
      width: 100%;
    }

    .input-wrap input {
      padding-right: 48px;
    }

    input::placeholder {
      color: var(--placeholder);
      opacity: 1;
    }

    input:hover:not(:focus) {
      border-color: #c3b9cd;
    }

    input:focus {
      background: var(--surface);
      border-color: var(--brand);
      box-shadow: var(--ring);
    }

    .field-group.has-error input {
      border-color: var(--danger);
    }

    .field-group.has-error input:focus {
      box-shadow: var(--ring-danger);
    }

    .error {
      align-items: center;
      color: var(--danger);
      display: none;
      font-size: 12.5px;
      gap: 6px;
      line-height: 1.35;
      margin: 8px 0 0 2px;
    }

    .field-group.has-error .error {
      animation: error-in 260ms var(--ease) both;
      display: flex;
    }

    .error svg {
      flex: none;
      height: 14px;
      width: 14px;
    }

    @keyframes error-in {
      from {
        opacity: 0;
        transform: translateY(-3px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    .eye {
      align-items: center;
      background: transparent;
      border: 0;
      border-radius: 8px;
      color: #8d8695;
      cursor: pointer;
      display: inline-flex;
      height: 34px;
      justify-content: center;
      padding: 0;
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      transition: background 180ms var(--ease), color 180ms var(--ease);
      width: 34px;
    }

    .eye:hover {
      background: var(--brand-tint);
      color: var(--brand-deep);
    }

    .eye svg {
      height: 19px;
      width: 19px;
    }

    .forgot-link {
      appearance: none;
      background: transparent;
      border: 0;
      border-radius: 6px;
      color: var(--brand);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      padding: 0;
      text-decoration: none;
      transition: color 180ms var(--ease);
      white-space: nowrap;
    }

    .forgot-link:hover {
      color: var(--brand-deep);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px;
    }

    input:focus-visible {
      outline: 0;
    }

    .sign-in-button {
      align-items: center;
      appearance: none;
      background: linear-gradient(180deg, #6a3392, var(--brand) 55%, #4d2270);
      border: 0;
      border-radius: var(--radius-field);
      box-shadow: var(--shadow-action);
      color: #ffffff;
      cursor: pointer;
      display: inline-flex;
      font-size: 13.5px;
      font-weight: 600;
      gap: 10px;
      height: 50px;
      justify-content: center;
      letter-spacing: 0.09em;
      margin-top: 28px;
      position: relative;
      text-transform: uppercase;
      transition: transform 180ms var(--ease), box-shadow 220ms var(--ease), filter 180ms var(--ease);
      width: 100%;
    }

    .sign-in-button:hover {
      box-shadow: 0 12px 26px -10px rgba(89, 42, 125, 0.7);
      filter: brightness(1.06);
      transform: translateY(-1px);
    }

    .sign-in-button:active {
      box-shadow: 0 4px 12px -8px rgba(89, 42, 125, 0.7);
      filter: brightness(0.94);
      transform: translateY(0);
    }

    .sign-in-button[aria-busy="true"] {
      cursor: default;
      filter: none;
      pointer-events: none;
    }

    .sign-in-button .spinner {
      animation: spin 700ms linear infinite;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      border-top-color: #ffffff;
      display: none;
      height: 15px;
      width: 15px;
    }

    .sign-in-button[aria-busy="true"] .spinner {
      display: block;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ---------- Embedded page ---------- */

    .iframe-screen {
      background: var(--surface);
      display: none;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .iframe-screen.active {
      animation: fade-in 320ms var(--ease) both;
      display: grid;
    }

    @keyframes fade-in {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .iframe-header {
      align-items: center;
      -webkit-backdrop-filter: saturate(180%) blur(12px);
      backdrop-filter: saturate(180%) blur(12px);
      background: rgba(255, 255, 255, 0.86);
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr auto 1fr;
      min-height: 60px;
      padding: 10px clamp(12px, 3vw, 22px);
      position: sticky;
      top: 0;
      z-index: 2;
    }

    .back-button {
      align-items: center;
      appearance: none;
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      color: var(--brand-deep);
      cursor: pointer;
      display: inline-flex;
      font-size: 13px;
      font-weight: 500;
      gap: 6px;
      height: 36px;
      justify-content: center;
      justify-self: start;
      padding: 0 14px 0 11px;
      transition: background 180ms var(--ease), border-color 180ms var(--ease), color 180ms var(--ease);
      width: max-content;
    }

    .back-button:hover {
      background: var(--brand-tint);
      border-color: rgba(89, 42, 125, 0.32);
    }

    .back-button:active {
      background: rgba(89, 42, 125, 0.14);
    }

    .back-button svg {
      height: 15px;
      width: 15px;
    }

    .iframe-title {
      color: var(--brand-deep);
      font-size: 14.5px;
      font-weight: 600;
      grid-column: 2;
      letter-spacing: 0.01em;
      margin: 0;
      text-align: center;
    }

    .frame-wrap {
      position: relative;
    }

    .frame-wrap::after {
      background: linear-gradient(90deg, var(--brand-deep), #8c5fae, var(--brand-deep));
      background-size: 220% 100%;
      content: "";
      height: 2px;
      left: 0;
      opacity: 0;
      position: absolute;
      right: 0;
      top: 0;
      transition: opacity 240ms var(--ease);
      z-index: 1;
    }

    .frame-wrap.loading::after {
      animation: sweep 1.1s linear infinite;
      opacity: 1;
    }

    @keyframes sweep {
      from {
        background-position: 100% 0;
      }
      to {
        background-position: -100% 0;
      }
    }

    iframe {
      border: 0;
      display: block;
      height: 100%;
      min-height: calc(100vh - 60px);
      min-height: calc(100svh - 60px);
      width: 100%;
    }

    @media (max-width: 480px) {
      .card {
        border-radius: 18px;
        padding: 24px 20px 26px;
      }

      .mark {
        font-size: 24px;
        height: 48px;
        width: 48px;
      }

      .subtitle {
        font-size: 14px;
      }

      input,
      .sign-in-button {
        height: 48px;
      }

      input {
        font-size: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      .sign-in-button:hover {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <main class="screen login-screen" id="loginScreen">
    <div class="card">
      <div class="topline">
        <span></span>
        <div class="mark" aria-label="Discovery"><span>D</span></div>
        <button class="close-button" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <path d="M6 6l12 12M18 6 6 18"></path>
          </svg>
        </button>
      </div>

      <div class="heading">
        <h1>Sign In</h1>
        <p class="subtitle">Sign in to continue to your account.</p>
      </div>

      <form class="login-form" id="loginForm" action="#" method="post" novalidate>
        <div class="field-group" id="usernameGroup">
          <div class="field-row">
            <label for="username">Username or email <span class="required" aria-hidden="true">*</span></label>
          </div>
          <input id="username" name="username" type="text" placeholder="Your username or email"
                 autocomplete="username" autocapitalize="none" spellcheck="false"
                 aria-describedby="usernameError">
          <p class="error" id="usernameError">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M12 7.5v5M12 16.2v.3"></path>
            </svg>
            <span>Enter your username or email</span>
          </p>
        </div>

        <div class="field-group" id="passwordGroup">
          <div class="field-row">
            <label for="password">Password <span class="required" aria-hidden="true">*</span></label>
            <a class="forgot-link" id="forgotPassword" href="https://www.ghadiscovery.com/member/forgot_password">Forgot password?</a>
          </div>
          <div class="input-wrap">
            <input id="password" name="password" type="password" placeholder="Your password"
                   autocomplete="current-password" aria-describedby="passwordError">
            <button class="eye" id="togglePassword" type="button" aria-label="Show password" aria-pressed="false">
              <svg id="eyeIcon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2.2 12S6 5.8 12 5.8S21.8 12 21.8 12S18 18.2 12 18.2S2.2 12 2.2 12Z"></path>
                <circle cx="12" cy="12" r="3.1"></circle>
              </svg>
            </button>
          </div>
          <p class="error" id="passwordError">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M12 7.5v5M12 16.2v.3"></path>
            </svg>
            <span>Enter your password</span>
          </p>
        </div>

        <button class="sign-in-button" id="signInButton" type="submit">
          <span class="spinner" aria-hidden="true"></span>
          <span>Sign In</span>
        </button>
      </form>
    </div>
  </main>

  <section class="screen iframe-screen" id="forgotScreen" aria-label="Forgot password">
    <header class="iframe-header">
      <button class="back-button" id="backButton" type="button" aria-label="Back to sign in">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5"></path>
          <path d="m12 19-7-7 7-7"></path>
        </svg>
        Back
      </button>
      <p class="iframe-title">Forgot Password</p>
    </header>

    <div class="frame-wrap" id="frameWrap">
      <iframe
        id="forgotFrame"
        title="Forgot password"
        referrerpolicy="no-referrer-when-downgrade"
        data-src="https://www.ghadiscovery.com/member/forgot_password">
      </iframe>
    </div>
  </section>

  <script>
    const forgotPasswordUrl = "https://www.ghadiscovery.com/member/forgot_password";
    const loginScreen = document.getElementById("loginScreen");
    const forgotScreen = document.getElementById("forgotScreen");
    const forgotFrame = document.getElementById("forgotFrame");
    const frameWrap = document.getElementById("frameWrap");
    const forgotPassword = document.getElementById("forgotPassword");
    const backButton = document.getElementById("backButton");
    const loginForm = document.getElementById("loginForm");
    const signInButton = document.getElementById("signInButton");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const usernameGroup = document.getElementById("usernameGroup");
    const passwordGroup = document.getElementById("passwordGroup");
    const togglePassword = document.getElementById("togglePassword");
    const eyeIcon = document.getElementById("eyeIcon");

    const eyeOpen =
      '<path d="M2.2 12S6 5.8 12 5.8S21.8 12 21.8 12S18 18.2 12 18.2S2.2 12 2.2 12Z"></path>' +
      '<circle cx="12" cy="12" r="3.1"></circle>';
    const eyeClosed =
      '<path d="M3 3l18 18"></path>' +
      '<path d="M10.6 6.1A9.9 9.9 0 0 1 12 6c6 0 9.8 6 9.8 6a17 17 0 0 1-2.5 3.2"></path>' +
      '<path d="M6.5 7.9A16.6 16.6 0 0 0 2.2 12S6 18 12 18a9.7 9.7 0 0 0 3.9-.8"></path>' +
      '<path d="M9.9 9.9a3.1 3.1 0 0 0 4.2 4.2"></path>';

    const setFieldError = (group, input, hasError) => {
      group.classList.toggle("has-error", hasError);
      input.setAttribute("aria-invalid", hasError ? "true" : "false");
    };

    const validateField = (group, input) => {
      const valid = input.value.trim().length > 0;
      setFieldError(group, input, !valid);
      return valid;
    };

    [[usernameGroup, usernameInput], [passwordGroup, passwordInput]].forEach(([group, input]) => {
      input.setAttribute("aria-invalid", "false");

      input.addEventListener("focus", () => {
        input.dataset.touched = "true";
      });

      input.addEventListener("input", () => {
        if (group.classList.contains("has-error") && input.value.trim().length > 0) {
          setFieldError(group, input, false);
        }
      });

      input.addEventListener("blur", () => {
        if (input.dataset.touched === "true" && input.value.trim().length === 0) {
          setFieldError(group, input, true);
        }
      });
    });

    loginForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const usernameValid = validateField(usernameGroup, usernameInput);
      const passwordValid = validateField(passwordGroup, passwordInput);

      if (!usernameValid) {
        usernameInput.focus();
        return;
      }

      if (!passwordValid) {
        passwordInput.focus();
        return;
      }

      signInButton.setAttribute("aria-busy", "true");
      signInButton.disabled = true;

      window.setTimeout(() => {
        signInButton.removeAttribute("aria-busy");
        signInButton.disabled = false;
      }, 900);
    });

    forgotPassword.addEventListener("click", (event) => {
      event.preventDefault();
      loginScreen.hidden = true;
      forgotScreen.classList.add("active");

      if (!forgotFrame.src) {
        frameWrap.classList.add("loading");
        forgotFrame.addEventListener("load", () => {
          frameWrap.classList.remove("loading");
        }, { once: true });
        forgotFrame.src = forgotPasswordUrl;
      }

      backButton.focus();
    });

    backButton.addEventListener("click", () => {
      forgotScreen.classList.remove("active");
      loginScreen.hidden = false;
      forgotPassword.focus();
    });

    togglePassword.addEventListener("click", () => {
      const reveal = passwordInput.type === "password";
      passwordInput.type = reveal ? "text" : "password";
      eyeIcon.innerHTML = reveal ? eyeClosed : eyeOpen;
      togglePassword.setAttribute("aria-label", reveal ? "Hide password" : "Show password");
      togglePassword.setAttribute("aria-pressed", reveal ? "true" : "false");
      passwordInput.focus();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && forgotScreen.classList.contains("active")) {
        backButton.click();
      }
    });
  </script>
</body>
</html>
