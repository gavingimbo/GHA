<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --brand: #4b176f;
      --brand-mid: #6b3290;
      --brand-soft: #b294c5;
      --danger: #e12525;
      --field: #d4d4d8;
      --muted: #71717a;
      --page: #ffffff;
      --text: #090909;
      --line: #e4e4e7;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      background: var(--page);
      color: var(--text);
      font-family: "Inter", Arial, Helvetica, sans-serif;
    }

    button,
    input,
    a {
      font: inherit;
    }

    .screen {
      min-height: 100vh;
      min-height: 100svh;
      width: 100%;
    }

    .login-screen {
      display: grid;
      grid-template-rows: auto 1fr;
      padding: clamp(16px, 2.5vw, 22px) clamp(18px, 8vw, 112px) clamp(28px, 5vw, 54px);
    }

    .topline {
      align-items: center;
      display: grid;
      grid-template-columns: 48px 1fr 48px;
      min-height: 66px;
    }

    .logo {
      align-items: center;
      background: var(--brand);
      border-radius: 50%;
      color: #ffffff;
      display: inline-flex;
      font-size: 30px;
      font-weight: 700;
      height: 56px;
      justify-content: center;
      justify-self: center;
      line-height: 1;
      width: 56px;
    }

    .logo span {
      display: block;
    }

    .close-button {
      align-items: center;
      appearance: none;
      background: transparent;
      border: 0;
      color: #18181b;
      cursor: pointer;
      display: inline-flex;
      font-size: 54px;
      font-weight: 300;
      height: 48px;
      justify-content: center;
      justify-self: end;
      line-height: 0.8;
      padding: 0;
      width: 48px;
    }

    .login-form {
      align-self: start;
      margin-top: clamp(28px, 5vw, 50px);
      max-width: 880px;
      width: min(100%, 880px);
    }

    h1 {
      color: var(--brand-mid);
      font-size: clamp(32px, 4.6vw, 42px);
      font-weight: 800;
      letter-spacing: 0;
      line-height: 1.1;
      margin: 0 0 38px;
      text-transform: uppercase;
    }

    .field-group {
      margin: 0 0 clamp(24px, 4vw, 36px);
    }

    .field-row {
      align-items: center;
      display: flex;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: clamp(24px, 3.2vw, 31px);
      letter-spacing: 2px;
      line-height: 1.15;
    }

    .required {
      color: #d50e22;
    }

    .input-wrap {
      position: relative;
    }

    input {
      background: #ffffff;
      border: 2px solid var(--field);
      border-radius: 8px;
      color: var(--text);
      display: block;
      font-size: clamp(24px, 3vw, 30px);
      height: clamp(62px, 7vw, 80px);
      outline: 0;
      padding: 0 72px 0 28px;
      width: 100%;
    }

    input::placeholder {
      color: #9e9e9e;
      opacity: 1;
    }

    input.invalid {
      border-color: var(--danger);
    }

    .error {
      color: var(--danger);
      font-size: clamp(21px, 2.6vw, 25px);
      line-height: 1.25;
      margin: 10px 0 0 28px;
    }

    .eye {
      align-items: center;
      background: transparent;
      border: 0;
      color: #7f7f7f;
      cursor: pointer;
      display: inline-flex;
      height: 52px;
      justify-content: center;
      padding: 0;
      position: absolute;
      right: 22px;
      top: 14px;
      width: 52px;
    }

    .eye svg {
      height: 34px;
      width: 34px;
    }

    .forgot-row {
      display: flex;
      justify-content: flex-end;
      margin: -18px 0 40px;
    }

    .forgot-link {
      align-items: center;
      appearance: none;
      background: transparent;
      border: 0;
      color: var(--brand-mid);
      cursor: pointer;
      display: inline-flex;
      font-size: clamp(21px, 2.7vw, 25px);
      font-weight: 700;
      min-height: 44px;
      padding: 6px 0;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .sign-in-button {
      appearance: none;
      background: #18181b;
      border: 1px solid #18181b;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      display: block;
      font-size: clamp(25px, 3.3vw, 31px);
      font-weight: 800;
      height: clamp(72px, 9vw, 101px);
      letter-spacing: 0;
      text-align: center;
      text-transform: uppercase;
      width: 100%;
    }

    .iframe-screen {
      background: #ffffff;
      display: none;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .iframe-screen.active {
      display: grid;
    }

    .login-screen.hidden {
      display: none;
    }

    .iframe-header {
      align-items: center;
      background: #ffffff;
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 14px;
      grid-template-columns: auto 1fr auto;
      padding: 14px clamp(14px, 4vw, 34px);
      position: sticky;
      top: 0;
      z-index: 2;
    }

    .back-button {
      align-items: center;
      appearance: none;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: #18181b;
      cursor: pointer;
      display: inline-flex;
      font-size: 15px;
      font-weight: 600;
      gap: 8px;
      letter-spacing: 0;
      min-height: 42px;
      padding: 0 14px 0 11px;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
      white-space: nowrap;
    }

    .back-button:hover {
      background: #fafafa;
      border-color: #c7c7cc;
    }

    .back-button:active {
      background: #f4f4f5;
    }

    .back-button svg {
      height: 18px;
      width: 18px;
    }

    .iframe-title {
      color: #18181b;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.2;
      margin: 0;
      text-align: center;
      text-transform: uppercase;
    }

    .open-link {
      color: #18181b;
      font-size: 15px;
      font-weight: 700;
      text-decoration: underline;
      white-space: nowrap;
    }

    iframe {
      border: 0;
      display: block;
      height: 100%;
      min-height: calc(100vh - 118px);
      min-height: calc(100svh - 118px);
      width: 100%;
    }

    .vendor-note {
      background: #fafafa;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
      padding: 10px 16px;
      text-align: center;
    }

    @media (max-width: 720px) {
      .login-screen {
        padding: 16px clamp(18px, 5vw, 24px) 28px;
      }

      .topline {
        grid-template-columns: 40px 1fr 40px;
        min-height: 54px;
      }

      .logo {
        font-size: 26px;
        height: 48px;
        width: 48px;
      }

      .close-button {
        font-size: 42px;
        height: 40px;
        width: 40px;
      }

      .login-form {
        margin-top: 28px;
      }

      h1 {
        font-size: 31px;
        margin-bottom: 24px;
      }

      label {
        font-size: 22px;
        letter-spacing: 1px;
      }

      input {
        font-size: 20px;
        height: 58px;
        padding-left: 18px;
        padding-right: 56px;
      }

      .field-group {
        margin-bottom: 22px;
      }

      .error {
        font-size: 18px;
        margin-left: 18px;
      }

      .eye {
        height: 44px;
        right: 12px;
        top: 10px;
        width: 44px;
      }

      .eye svg {
        height: 28px;
        width: 28px;
      }

      .forgot-row {
        margin: -8px 0 22px;
      }

      .forgot-link {
        font-size: 20px;
      }

      .sign-in-button {
        height: 64px;
        font-size: 24px;
      }

      .iframe-header {
        grid-template-columns: 1fr auto;
      }

      .iframe-title {
        grid-column: 1 / -1;
        grid-row: 2;
        text-align: left;
      }

      .open-link {
        justify-self: end;
      }

      iframe {
        min-height: calc(100vh - 154px);
        min-height: calc(100svh - 154px);
      }
    }

    @media (max-width: 420px) {
      .login-screen {
        padding-left: 16px;
        padding-right: 16px;
      }

      .topline {
        min-height: 48px;
      }

      .logo {
        font-size: 24px;
        height: 44px;
        width: 44px;
      }

      .close-button {
        font-size: 38px;
      }

      .login-form {
        margin-top: 22px;
      }

      h1 {
        font-size: 28px;
      }

      label {
        font-size: 20px;
      }

      input {
        font-size: 18px;
      }

      .error {
        font-size: 17px;
      }

      .iframe-header {
        gap: 9px;
        padding: 10px 12px;
      }

      .back-button {
        font-size: 13px;
        gap: 8px;
        min-height: 40px;
        padding: 0 12px 0 10px;
      }

      .back-button svg {
        height: 17px;
        width: 17px;
      }

      .iframe-title {
        font-size: 18px;
      }

      .open-link {
        font-size: 13px;
      }

      .vendor-note {
        font-size: 12px;
        padding: 8px 10px;
      }
    }
  </style>
</head>
<body>
  <main class="screen login-screen" id="loginScreen">
    <div class="topline" aria-label="Brand header">
      <span></span>
      <div class="logo" aria-label="Discovery logo"><span>D</span></div>
      <button class="close-button" type="button" aria-label="Close">&times;</button>
    </div>

    <form class="login-form" action="#" method="post">
      <h1>Sign In</h1>

      <div class="field-group">
        <label for="username">Username Or Email <span class="required">*</span></label>
        <input class="invalid" id="username" name="username" type="text" placeholder="Your username or email" autocomplete="username">
        <p class="error">Username or email is required</p>
      </div>

      <div class="field-group">
        <label for="password">Password <span class="required">*</span></label>
        <div class="input-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password">
          <button class="eye" id="togglePassword" type="button" aria-label="Show password">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div class="forgot-row">
        <a class="forgot-link" id="forgotPassword" href="https://www.ghadiscovery.com/member/forgot_password">Forgot Password?</a>
      </div>

      <button class="sign-in-button" type="submit">Sign In</button>
    </form>
  </main>

  <section class="screen iframe-screen" id="forgotScreen" aria-label="Forgot password iframe">
    <header class="iframe-header">
      <button class="back-button" id="backButton" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5"></path>
          <path d="m12 19-7-7 7-7"></path>
        </svg>
        Back to Sign In
      </button>
      <p class="iframe-title">Forgot Password</p>
      <a class="open-link" href="https://www.ghadiscovery.com/member/forgot_password" target="_blank" rel="noopener">Open in New Tab</a>
    </header>

    <iframe
      id="forgotFrame"
      title="Forgot password page"
      referrerpolicy="no-referrer-when-downgrade"
      data-src="https://www.ghadiscovery.com/member/forgot_password">
    </iframe>

    <div class="vendor-note">
      Vendor note: this iframe demonstrates the desired flow. If the embedded page is blank, the destination is likely blocking iframe embedding and would need to allow this parent page/domain.
    </div>
  </section>

  <script>
    const forgotPasswordUrl = "https://www.ghadiscovery.com/member/forgot_password";
    const loginScreen = document.getElementById("loginScreen");
    const forgotScreen = document.getElementById("forgotScreen");
    const forgotFrame = document.getElementById("forgotFrame");
    const forgotPassword = document.getElementById("forgotPassword");
    const backButton = document.getElementById("backButton");
    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");

    forgotPassword.addEventListener("click", (event) => {
      event.preventDefault();
      loginScreen.classList.add("hidden");
      forgotScreen.classList.add("active");

      if (!forgotFrame.src) {
        forgotFrame.src = forgotPasswordUrl;
      }
    });

    backButton.addEventListener("click", () => {
      forgotScreen.classList.remove("active");
      loginScreen.classList.remove("hidden");
    });

    togglePassword.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";
      togglePassword.setAttribute("aria-label", isPassword ? "Hide password" : "Show password");
    });
  </script>
</body>
</html>
