<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --brand: #592a7d;
      --brand-deep: #300b5c;
      --brand-mid: #76568e;
      --brand-soft: #b5a1c3;
      --danger: #b31b1b;
      --field: #b6b5b5;
      --muted: #68656b;
      --page: #fdf9f7;
      --text: #191919;
      --line: #e5e2e4;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      background: var(--page);
      color: var(--text);
      font-family: "Inter", Arial, Helvetica, sans-serif;
    }

    button,
    input,
    a {
      font: inherit;
    }

    .screen {
      min-height: 100vh;
      min-height: 100svh;
      width: 100%;
    }

    .login-screen {
      background: #ffffff;
      display: grid;
      grid-template-rows: auto 1fr;
      padding: clamp(18px, 2.4vw, 28px) clamp(20px, 9.5vw, 112px) clamp(32px, 5vw, 56px);
    }

    .topline {
      align-items: center;
      display: grid;
      grid-template-columns: 48px 1fr 48px;
      min-height: 58px;
    }

    .logo {
      align-items: center;
      background: var(--brand-deep);
      border-radius: 50%;
      color: #ffffff;
      display: inline-flex;
      font-size: 29px;
      font-weight: 600;
      height: 54px;
      justify-content: center;
      justify-self: center;
      line-height: 1;
      width: 54px;
    }

    .logo span {
      display: block;
    }

    .close-button {
      align-items: center;
      appearance: none;
      background: transparent;
      border: 0;
      color: var(--brand-deep);
      cursor: pointer;
      display: inline-flex;
      font-size: 42px;
      font-weight: 300;
      height: 48px;
      justify-content: center;
      justify-self: end;
      line-height: 0.8;
      padding: 0;
      width: 48px;
    }

    .login-form {
      align-self: start;
      margin-top: clamp(34px, 5.2vw, 56px);
      max-width: 880px;
      width: min(100%, 880px);
    }

    h1 {
      color: var(--brand-deep);
      font-size: clamp(30px, 4.1vw, 40px);
      font-weight: 800;
      letter-spacing: 0;
      line-height: 1.1;
      margin: 0 0 clamp(30px, 4vw, 42px);
      text-transform: uppercase;
    }

    .field-group {
      margin: 0 0 clamp(27px, 3.4vw, 36px);
    }

    .field-row {
      align-items: center;
      display: flex;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: clamp(20px, 2.6vw, 28px);
      font-weight: 500;
      letter-spacing: 0;
      line-height: 1.25;
    }

    .required {
      color: var(--danger);
    }

    .input-wrap {
      position: relative;
    }

    input {
      background: #ffffff;
      border: 1.5px solid var(--field);
      border-radius: 8px;
      color: var(--text);
      display: block;
      font-size: clamp(18px, 2.35vw, 24px);
      height: clamp(58px, 6vw, 72px);
      outline: 0;
      padding: 0 68px 0 24px;
      width: 100%;
    }

    input::placeholder {
      color: #919191;
      opacity: 1;
    }

    input.invalid {
      border-color: var(--danger);
    }

    input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(89, 42, 125, 0.12);
    }

    .error {
      color: var(--danger);
      font-size: clamp(15px, 1.8vw, 18px);
      line-height: 1.25;
      margin: 9px 0 0 24px;
    }

    .eye {
      align-items: center;
      background: transparent;
      border: 0;
      color: #7f7f7f;
      cursor: pointer;
      display: inline-flex;
      height: 52px;
      justify-content: center;
      padding: 0;
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 52px;
    }

    .eye svg {
      height: 34px;
      width: 34px;
    }

    .forgot-row {
      display: flex;
      justify-content: center;
      margin: -5px 0 36px;
    }

    .forgot-link {
      align-items: center;
      appearance: none;
      background: transparent;
      border: 0;
      color: var(--brand);
      cursor: pointer;
      display: inline-flex;
      font-size: clamp(16px, 2vw, 19px);
      font-weight: 700;
      min-height: 44px;
      padding: 6px 0;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .forgot-link:hover {
      color: var(--brand-deep);
    }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(89, 42, 125, 0.22);
      outline-offset: 3px;
    }

    .sign-in-button {
      appearance: none;
      background: var(--brand);
      border: 1px solid var(--brand);
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      display: block;
      font-size: clamp(16px, 2vw, 19px);
      font-weight: 700;
      height: clamp(58px, 6.5vw, 70px);
      letter-spacing: 0.08em;
      text-align: center;
      text-transform: uppercase;
      width: 100%;
      transition: background 160ms ease, border-color 160ms ease;
    }

    .sign-in-button:hover {
      background: var(--brand-deep);
      border-color: var(--brand-deep);
    }

    .sign-in-button:active {
      background: #240845;
      border-color: #240845;
    }

    .iframe-screen {
      background: #ffffff;
      display: none;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .iframe-screen.active {
      display: grid;
    }

    .login-screen.hidden {
      display: none;
    }

    .iframe-header {
      align-items: center;
      background: #ffffff;
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 14px;
      grid-template-columns: 1fr auto 1fr;
      padding: 14px clamp(14px, 4vw, 34px);
      position: sticky;
      top: 0;
      z-index: 2;
    }

    .back-button {
      align-items: center;
      appearance: none;
      background: var(--brand);
      border: 1px solid var(--brand);
      border-radius: 999px;
      color: #ffffff;
      cursor: pointer;
      display: inline-flex;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      gap: 8px;
      letter-spacing: 0;
      height: 40px;
      justify-content: center;
      padding: 0 15px 0 12px;
      position: relative;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
      width: max-content;
    }

    .iframe-header .back-button {
      justify-self: start;
    }

    .back-button:hover {
      background: #482066;
      border-color: #482066;
    }

    .back-button:active {
      background: #3d1b57;
      border-color: #3d1b57;
    }

    .back-button svg {
      height: 18px;
      width: 18px;
    }

    .iframe-title {
      color: var(--brand-deep);
      font-family: inherit;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.2;
      margin: 0;
      text-align: center;
      grid-column: 2;
    }

    iframe {
      border: 0;
      display: block;
      height: 100%;
      min-height: calc(100vh - 118px);
      min-height: calc(100svh - 118px);
      width: 100%;
    }

    .vendor-note {
      background: var(--page);
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
      padding: 10px 16px;
      text-align: center;
    }

    @media (max-width: 720px) {
      .login-screen {
        padding: 18px clamp(18px, 5vw, 24px) 30px;
      }

      .topline {
        grid-template-columns: 40px 1fr 40px;
        min-height: 50px;
      }

      .logo {
        font-size: 24px;
        height: 46px;
        width: 46px;
      }

      .close-button {
        font-size: 38px;
        height: 40px;
        width: 40px;
      }

      .login-form {
        max-width: 100%;
      }

      .login-form {
        margin-top: 38px;
      }

      h1 {
        font-size: 29px;
        margin-bottom: 30px;
      }

      label {
        font-size: 18px;
      }

      input {
        font-size: 16px;
        height: 58px;
        padding-left: 16px;
        padding-right: 56px;
      }

      .field-group {
        margin-bottom: 26px;
      }

      .error {
        font-size: 14px;
        margin-left: 16px;
      }

      .eye {
        height: 44px;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        width: 44px;
      }

      .eye svg {
        height: 28px;
        width: 28px;
      }

      .forgot-row {
        margin: -3px 0 28px;
      }

      .forgot-link {
        font-size: 16px;
      }

      .sign-in-button {
        height: 58px;
        font-size: 16px;
      }

      .iframe-header {
        grid-template-columns: 1fr auto 1fr;
      }

      .iframe-title {
        font-size: 18px;
        text-align: center;
      }

      iframe {
        min-height: calc(100vh - 154px);
        min-height: calc(100svh - 154px);
      }
    }

    @media (max-width: 420px) {
      .login-screen {
        padding-left: 16px;
        padding-right: 16px;
      }

      .topline {
        min-height: 48px;
      }

      .logo {
        font-size: 24px;
        height: 44px;
        width: 44px;
      }

      .close-button {
        font-size: 38px;
      }

      .login-form {
        margin-top: 22px;
      }

      h1 {
        font-size: 28px;
      }

      label {
        font-size: 20px;
      }

      input {
        font-size: 18px;
      }

      .error {
        font-size: 17px;
      }

      .iframe-header {
        gap: 9px;
        padding: 10px 12px;
      }

      .back-button {
        height: 40px;
        font-size: 13px;
        padding: 0 14px 0 11px;
      }

      .back-button svg {
        height: 17px;
        width: 17px;
      }

      .vendor-note {
        font-size: 12px;
        padding: 8px 10px;
      }
    }
  </style>
</head>
<body>
  <main class="screen login-screen" id="loginScreen">
    <div class="topline" aria-label="Brand header">
      <span></span>
      <div class="logo" aria-label="Discovery logo"><span>D</span></div>
      <button class="close-button" type="button" aria-label="Close">&times;</button>
    </div>

    <form class="login-form" action="#" method="post">
      <h1>Sign In</h1>

      <div class="field-group">
        <label for="username">Username Or Email <span class="required">*</span></label>
        <input class="invalid" id="username" name="username" type="text" placeholder="Your username or email" autocomplete="username">
        <p class="error">Username or email is required</p>
      </div>

      <div class="field-group">
        <label for="password">Password <span class="required">*</span></label>
        <div class="input-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password">
          <button class="eye" id="togglePassword" type="button" aria-label="Show password">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div class="forgot-row">
        <a class="forgot-link" id="forgotPassword" href="https://www.ghadiscovery.com/member/forgot_password">Forgot Password?</a>
      </div>

      <button class="sign-in-button" type="submit">Sign In</button>
    </form>
  </main>

  <section class="screen iframe-screen" id="forgotScreen" aria-label="Forgot password iframe">
    <header class="iframe-header">
      <button class="back-button" id="backButton" type="button" aria-label="Back to sign in" title="Back to sign in">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5"></path>
          <path d="m12 19-7-7 7-7"></path>
        </svg>
        Back to Sign In
      </button>
      <p class="iframe-title">Forgot Password</p>
    </header>

    <iframe
      id="forgotFrame"
      title="Forgot password page"
      referrerpolicy="no-referrer-when-downgrade"
      data-src="https://www.ghadiscovery.com/member/forgot_password">
    </iframe>

    <div class="vendor-note">
      Vendor note: this iframe demonstrates the desired flow. If the embedded page is blank, the destination is likely blocking iframe embedding and would need to allow this parent page/domain.
    </div>
  </section>

  <script>
    const forgotPasswordUrl = "https://www.ghadiscovery.com/member/forgot_password";
    const loginScreen = document.getElementById("loginScreen");
    const forgotScreen = document.getElementById("forgotScreen");
    const forgotFrame = document.getElementById("forgotFrame");
    const forgotPassword = document.getElementById("forgotPassword");
    const backButton = document.getElementById("backButton");
    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");

    document.querySelector(".login-form").addEventListener("submit", (event) => {
      event.preventDefault();
    });

    forgotPassword.addEventListener("click", (event) => {
      event.preventDefault();
      loginScreen.classList.add("hidden");
      forgotScreen.classList.add("active");

      if (!forgotFrame.src) {
        forgotFrame.src = forgotPasswordUrl;
      }
    });

    backButton.addEventListener("click", () => {
      forgotScreen.classList.remove("active");
      loginScreen.classList.remove("hidden");
    });

    togglePassword.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";
      togglePassword.setAttribute("aria-label", isPassword ? "Hide password" : "Show password");
    });
  </script>
</body>
</html>
