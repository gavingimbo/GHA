  <style>
    :root {
      color-scheme: light;

      /* Mirror env() once, so there is a single source of truth and the
         resolved value is readable from JS. Never assume the top inset is
         greater than zero: it is 0px on an SE, in landscape, and in
         `default` status-bar mode. */
      --safe-area-inset-top: env(safe-area-inset-top, 0px);
      --safe-area-inset-right: env(safe-area-inset-right, 0px);
      --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
      --safe-area-inset-left: env(safe-area-inset-left, 0px);

      /* Bar heights are base + inset, never the inset alone. */
      --header-height: calc(64px + var(--safe-area-inset-top));

      --brand: #592a7d;
      --brand-deep: #300b5c;
      --brand-tint: rgba(89, 42, 125, 0.07);
      --brand-tint-strong: rgba(89, 42, 125, 0.12);

      --danger: #b31b1b;
      --danger-tint: rgba(179, 27, 27, 0.06);

      --page: #ffffff;
      --field: #f4f1f6;
      --field-hover: #efebf2;
      --text: #1a1520;
      --muted: #6b6572;
      --placeholder: #a49daa;

      --radius-field: 14px;

      --ring: 0 0 0 3px rgba(89, 42, 125, 0.16);
      --ring-danger: 0 0 0 3px rgba(179, 27, 27, 0.14);

      --shadow-mark: 0 10px 24px -12px rgba(48, 11, 92, 0.45);
      --shadow-action: 0 10px 24px -12px rgba(89, 42, 125, 0.7);
      --shadow-header: 0 14px 28px -26px rgba(48, 11, 92, 0.7);

      --ease: cubic-bezier(0.32, 0.72, 0, 1);

      scroll-padding-top: var(--header-height);
    }

    * {
      box-sizing: border-box;
    }

    /* Kill the grey tap flash everywhere. */
    :where(*) {
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      /* A real background colour: a transparent root tints the status bar white. */
      background-color: var(--page);
      background-image:
        radial-gradient(75% 55% at 50% -8%, rgba(89, 42, 125, 0.09), transparent 68%),
        radial-gradient(90% 60% at 50% 108%, rgba(48, 11, 92, 0.06), transparent 66%);
      background-attachment: fixed;
      background-repeat: no-repeat;
      color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      letter-spacing: -0.006em;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    /* Own the scroll container: one scrolling element, no document bounce
       behind sticky bars. overscroll-behavior must be parsed before the first
       touchstart, so it lives here and never gets set from JS. */
    #root {
      height: 100%;
      min-height: 100vh;
      isolation: isolate;
      overflow-y: scroll;
      overscroll-behavior-y: contain;
    }

    @media not all and (display-mode: standalone) {
      #root {
        min-height: -webkit-fill-available;
      }
    }

    button,
    input,
    a {
      font: inherit;
      letter-spacing: inherit;
    }

    /* Chrome only, never body text. */
    .topbar,
    .iframe-header,
    button,
    label {
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    ::selection {
      background: rgba(89, 42, 125, 0.16);
    }

    /* 100vh, not dvh/svh: dvh reports the wrong height until layout settles
       on a cold standalone launch. */
    .screen {
      min-height: 100vh;
      width: 100%;
    }

    /* ---------- Sign in ---------- */

    .login-screen {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .login-screen[hidden] {
      display: none;
    }

    .topbar {
      align-items: center;
      display: flex;
      justify-content: space-between;
      padding:
        calc(clamp(18px, 3vw, 30px) + var(--safe-area-inset-top))
        calc(clamp(18px, 4vw, 44px) + var(--safe-area-inset-right))
        clamp(18px, 3vw, 30px)
        calc(clamp(18px, 4vw, 44px) + var(--safe-area-inset-left));
    }

    .mark {
      align-items: center;
      animation: fade-up 560ms var(--ease) both;
      background: radial-gradient(120% 120% at 30% 10%, #7d47aa, var(--brand-deep) 74%);
      border-radius: 50%;
      box-shadow: var(--shadow-mark), inset 0 1px 0 rgba(255, 255, 255, 0.22);
      color: #ffffff;
      display: inline-flex;
      font-size: 24px;
      font-weight: 600;
      height: 48px;
      justify-content: center;
      line-height: 1;
      width: 48px;
    }

    .mark span {
      display: block;
      transform: translateY(-0.5px);
    }

    .close-button {
      align-items: center;
      appearance: none;
      background: transparent;
      border: 0;
      border-radius: 50%;
      color: var(--muted);
      cursor: pointer;
      display: inline-flex;
      height: 44px;
      justify-content: center;
      padding: 0;
      transition: background 180ms var(--ease), color 180ms var(--ease);
      width: 44px;
    }

    .close-button svg {
      height: 18px;
      width: 18px;
    }

    .login-body {
      align-items: center;
      display: grid;
      justify-items: center;
      padding:
        0
        calc(clamp(20px, 5vw, 44px) + var(--safe-area-inset-right))
        calc(clamp(48px, 9vh, 96px) + var(--safe-area-inset-bottom))
        calc(clamp(20px, 5vw, 44px) + var(--safe-area-inset-left));
    }

    .login-inner {
      animation: fade-up 640ms var(--ease) both;
      width: min(100%, 428px);
    }

    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    .heading {
      margin-bottom: clamp(30px, 5vw, 42px);
    }

    h1 {
      color: var(--brand-deep);
      font-size: clamp(26px, 4.4vw, 32px);
      font-weight: 700;
      letter-spacing: 0.09em;
      line-height: 1.1;
      margin: 0;
      text-transform: uppercase;
    }

    .subtitle {
      color: var(--muted);
      font-size: 15.5px;
      line-height: 1.5;
      margin: 12px 0 0;
      max-width: 34ch;
    }

    .field-group {
      margin: 0 0 20px;
    }

    .field-group:last-of-type {
      margin-bottom: 0;
    }

    .field-row {
      align-items: baseline;
      display: flex;
      gap: 12px;
      justify-content: space-between;
      margin-bottom: 9px;
      padding: 0 2px;
    }

    label {
      color: #2c2434;
      display: block;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0;
      line-height: 1.3;
    }

    .required {
      color: var(--danger);
    }

    .input-wrap {
      position: relative;
    }

    input {
      background: var(--field);
      border: 0;
      border-radius: var(--radius-field);
      color: var(--text);
      display: block;
      /* >=16px: iOS zooms the viewport on focus below that. */
      font-size: 16px;
      height: 56px;
      outline: 0;
      padding: 0 18px;
      transition: background 180ms var(--ease), box-shadow 180ms var(--ease);
      width: 100%;
    }

    .input-wrap input {
      padding-right: 56px;
    }

    input::placeholder {
      color: var(--placeholder);
      opacity: 1;
    }

    input:focus {
      background: var(--brand-tint);
      box-shadow: var(--ring);
    }

    .field-group.has-error input {
      background: var(--danger-tint);
      box-shadow: var(--ring-danger);
    }

    .error {
      align-items: center;
      color: var(--danger);
      display: none;
      font-size: 13px;
      gap: 6px;
      line-height: 1.35;
      margin: 9px 0 0;
      padding: 0 2px;
    }

    .field-group.has-error .error {
      animation: error-in 260ms var(--ease) both;
      display: flex;
    }

    .error svg {
      flex: none;
      height: 15px;
      width: 15px;
    }

    @keyframes error-in {
      from {
        opacity: 0;
        transform: translateY(-3px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    .eye {
      align-items: center;
      background: transparent;
      border: 0;
      border-radius: 10px;
      color: #8d8695;
      cursor: pointer;
      display: inline-flex;
      height: 44px;
      justify-content: center;
      padding: 0;
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      transition: background 180ms var(--ease), color 180ms var(--ease);
      width: 44px;
    }

    .eye svg {
      height: 20px;
      width: 20px;
    }

    .forgot-link {
      appearance: none;
      background: transparent;
      border: 0;
      color: var(--brand);
      cursor: pointer;
      font-size: 13.5px;
      font-weight: 500;
      padding: 0;
      text-decoration: none;
      touch-action: manipulation;
      transition: color 180ms var(--ease);
      white-space: nowrap;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 3px;
    }

    input:focus-visible {
      outline: 0;
    }

    .sign-in-button {
      align-items: center;
      appearance: none;
      background: linear-gradient(180deg, #6d3596, var(--brand) 55%, #4b216d);
      border: 0;
      border-radius: var(--radius-field);
      box-shadow: var(--shadow-action);
      color: #ffffff;
      cursor: pointer;
      display: inline-flex;
      font-size: 14px;
      font-weight: 600;
      gap: 10px;
      height: 56px;
      justify-content: center;
      letter-spacing: 0.09em;
      margin-top: 32px;
      text-transform: uppercase;
      transition: transform 180ms var(--ease), box-shadow 220ms var(--ease), filter 180ms var(--ease);
      width: 100%;
    }

    .sign-in-button:active {
      box-shadow: 0 6px 14px -10px rgba(89, 42, 125, 0.7);
      filter: brightness(0.94);
      transform: translateY(0);
    }

    .sign-in-button[aria-busy="true"] {
      cursor: default;
      filter: none;
      pointer-events: none;
    }

    .sign-in-button .spinner {
      animation: spin 700ms linear infinite;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      border-top-color: #ffffff;
      display: none;
      height: 15px;
      width: 15px;
    }

    .sign-in-button[aria-busy="true"] .spinner {
      display: block;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ---------- Embedded page ---------- */

    .iframe-screen {
      background: var(--page);
      display: none;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .iframe-screen.active {
      animation: fade-in 320ms var(--ease) both;
      display: grid;
    }

    @keyframes fade-in {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    /* A real background (plus blur) on the sticky header: Safari samples it
       for the status-bar tint, and content must not show through crisply. */
    .iframe-header {
      align-items: center;
      -webkit-backdrop-filter: saturate(180%) blur(14px);
      backdrop-filter: saturate(180%) blur(14px);
      background: rgba(255, 255, 255, 0.9);
      box-shadow: var(--shadow-header);
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr auto 1fr;
      min-height: var(--header-height);
      padding:
        calc(12px + var(--safe-area-inset-top))
        calc(clamp(14px, 4vw, 32px) + var(--safe-area-inset-right))
        12px
        calc(clamp(14px, 4vw, 32px) + var(--safe-area-inset-left));
      position: sticky;
      top: 0;
      z-index: 2;
    }

    .back-button {
      align-items: center;
      appearance: none;
      background: var(--brand-tint);
      border: 0;
      border-radius: 999px;
      color: var(--brand-deep);
      cursor: pointer;
      display: inline-flex;
      font-size: 13.5px;
      font-weight: 500;
      gap: 7px;
      height: 40px;
      justify-content: center;
      justify-self: start;
      padding: 0 16px 0 13px;
      transition: background 180ms var(--ease), color 180ms var(--ease);
      width: max-content;
    }

    .back-button:active {
      background: rgba(89, 42, 125, 0.18);
    }

    .back-button svg {
      height: 16px;
      width: 16px;
    }

    .iframe-title {
      color: var(--brand-deep);
      font-size: 15px;
      font-weight: 600;
      grid-column: 2;
      letter-spacing: 0.01em;
      margin: 0;
      text-align: center;
    }

    .frame-wrap {
      position: relative;
    }

    .frame-wrap::after {
      background: linear-gradient(90deg, transparent, var(--brand), #a274c4, transparent);
      background-size: 220% 100%;
      content: "";
      height: 2px;
      left: 0;
      opacity: 0;
      position: absolute;
      right: 0;
      top: 0;
      transition: opacity 240ms var(--ease);
      z-index: 1;
    }

    .frame-wrap.loading::after {
      animation: sweep 1.1s linear infinite;
      opacity: 1;
    }

    @keyframes sweep {
      from {
        background-position: 100% 0;
      }
      to {
        background-position: -100% 0;
      }
    }

    iframe {
      border: 0;
      display: block;
      height: 100%;
      min-height: calc(100vh - var(--header-height));
      width: 100%;
    }

    /* Hover styling only where hover really exists, so it never sticks
       after a tap. */
    @media (hover: hover) {
      .close-button:hover {
        background: var(--brand-tint);
        color: var(--brand-deep);
      }

      input:hover:not(:focus) {
        background: var(--field-hover);
      }

      .eye:hover {
        background: var(--brand-tint-strong);
        color: var(--brand-deep);
      }

      .forgot-link:hover {
        color: var(--brand-deep);
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .sign-in-button:hover {
        box-shadow: 0 16px 30px -14px rgba(89, 42, 125, 0.75);
        filter: brightness(1.07);
        transform: translateY(-1px);
      }

      .back-button:hover {
        background: var(--brand-tint-strong);
      }
    }

    @media (max-width: 520px) {
      .login-body {
        padding-bottom: calc(clamp(40px, 12vh, 88px) + var(--safe-area-inset-bottom));
      }

      .subtitle {
        font-size: 15px;
      }

      input,
      .sign-in-button {
        height: 54px;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      html {
        scroll-behavior: smooth;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      .sign-in-button:hover {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div id="root">
    <main class="screen login-screen" id="loginScreen">
      <div class="topbar">
        <div class="mark" aria-label="Discovery"><span>D</span></div>
        <button class="close-button" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M6 6l12 12M18 6 6 18"></path>
          </svg>
        </button>
      </div>

      <div class="login-body">
        <div class="login-inner">
          <div class="heading">
            <h1>Sign In</h1>
            <p class="subtitle">Sign in to continue to your account.</p>
          </div>

          <form class="login-form" id="loginForm" action="#" method="post" novalidate>
            <div class="field-group" id="usernameGroup">
              <div class="field-row">
                <label for="username">Username or email <span class="required" aria-hidden="true">*</span></label>
              </div>
              <input id="username" name="username" type="text" placeholder="Your username or email"
                     autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"
                     aria-describedby="usernameError">
              <p class="error" id="usernameError">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                  <circle cx="12" cy="12" r="9"></circle>
                  <path d="M12 7.5v5M12 16.2v.3"></path>
                </svg>
                <span>Enter your username or email</span>
              </p>
            </div>

            <div class="field-group" id="passwordGroup">
              <div class="field-row">
                <label for="password">Password <span class="required" aria-hidden="true">*</span></label>
                <a class="forgot-link" id="forgotPassword" href="https://www.ghadiscovery.com/member/forgot_password">Forgot password?</a>
              </div>
              <div class="input-wrap">
                <input id="password" name="password" type="password" placeholder="Your password"
                       autocomplete="current-password" aria-describedby="passwordError">
                <button class="eye" id="togglePassword" type="button" aria-label="Show password" aria-pressed="false">
                  <svg id="eyeIcon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2.2 12S6 5.8 12 5.8S21.8 12 21.8 12S18 18.2 12 18.2S2.2 12 2.2 12Z"></path>
                    <circle cx="12" cy="12" r="3.1"></circle>
                  </svg>
                </button>
              </div>
              <p class="error" id="passwordError">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                  <circle cx="12" cy="12" r="9"></circle>
                  <path d="M12 7.5v5M12 16.2v.3"></path>
                </svg>
                <span>Enter your password</span>
              </p>
            </div>

            <button class="sign-in-button" id="signInButton" type="submit">
              <span class="spinner" aria-hidden="true"></span>
              <span>Sign In</span>
            </button>
          </form>
        </div>
      </div>
    </main>

    <section class="screen iframe-screen" id="forgotScreen" aria-label="Forgot password">
      <header class="iframe-header">
        <button class="back-button" id="backButton" type="button" aria-label="Back to sign in">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5"></path>
            <path d="m12 19-7-7 7-7"></path>
          </svg>
          Back
        </button>
        <p class="iframe-title">Forgot Password</p>
      </header>

      <div class="frame-wrap" id="frameWrap">
        <iframe
          id="forgotFrame"
          title="Forgot password"
          referrerpolicy="no-referrer-when-downgrade"
          data-src="https://www.ghadiscovery.com/member/forgot_password">
        </iframe>
      </div>
    </section>
  </div>

  <script>
    const forgotPasswordUrl = "https://www.ghadiscovery.com/member/forgot_password";
    const root = document.getElementById("root");
    const loginScreen = document.getElementById("loginScreen");
    const forgotScreen = document.getElementById("forgotScreen");
    const forgotFrame = document.getElementById("forgotFrame");
    const frameWrap = document.getElementById("frameWrap");
    const forgotPassword = document.getElementById("forgotPassword");
    const backButton = document.getElementById("backButton");
    const loginForm = document.getElementById("loginForm");
    const signInButton = document.getElementById("signInButton");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const usernameGroup = document.getElementById("usernameGroup");
    const passwordGroup = document.getElementById("passwordGroup");
    const togglePassword = document.getElementById("togglePassword");
    const eyeIcon = document.getElementById("eyeIcon");

    const eyeOpen =
      '<path d="M2.2 12S6 5.8 12 5.8S21.8 12 21.8 12S18 18.2 12 18.2S2.2 12 2.2 12Z"></path>' +
      '<circle cx="12" cy="12" r="3.1"></circle>';
    const eyeClosed =
      '<path d="M3 3l18 18"></path>' +
      '<path d="M10.6 6.1A9.9 9.9 0 0 1 12 6c6 0 9.8 6 9.8 6a17 17 0 0 1-2.5 3.2"></path>' +
      '<path d="M6.5 7.9A16.6 16.6 0 0 0 2.2 12S6 18 12 18a9.7 9.7 0 0 0 3.9-.8"></path>' +
      '<path d="M9.9 9.9a3.1 3.1 0 0 0 4.2 4.2"></path>';

    const setFieldError = (group, input, hasError) => {
      group.classList.toggle("has-error", hasError);
      input.setAttribute("aria-invalid", hasError ? "true" : "false");
    };

    const validateField = (group, input) => {
      const valid = input.value.trim().length > 0;
      setFieldError(group, input, !valid);
      return valid;
    };

    [[usernameGroup, usernameInput], [passwordGroup, passwordInput]].forEach(([group, input]) => {
      input.setAttribute("aria-invalid", "false");

      input.addEventListener("focus", () => {
        input.dataset.touched = "true";
      });

      input.addEventListener("input", () => {
        if (group.classList.contains("has-error") && input.value.trim().length > 0) {
          setFieldError(group, input, false);
        }
      });

      input.addEventListener("blur", () => {
        if (input.dataset.touched === "true" && input.value.trim().length === 0) {
          setFieldError(group, input, true);
        }
      });
    });

    // Focus without letting the browser scroll for us, then bring the field
    // above the keyboard once the visual viewport has settled.
    const revealField = (input) => {
      input.focus({ preventScroll: true });
      const scrollIntoView = () => input.scrollIntoView({ block: "center" });
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", scrollIntoView, { once: true });
        window.setTimeout(scrollIntoView, 300);
      } else {
        scrollIntoView();
      }
    };

    loginForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const usernameValid = validateField(usernameGroup, usernameInput);
      const passwordValid = validateField(passwordGroup, passwordInput);

      if (!usernameValid) {
        revealField(usernameInput);
        return;
      }

      if (!passwordValid) {
        revealField(passwordInput);
        return;
      }

      signInButton.setAttribute("aria-busy", "true");
      signInButton.disabled = true;

      window.setTimeout(() => {
        signInButton.removeAttribute("aria-busy");
        signInButton.disabled = false;
      }, 900);
    });

    // Standalone has no browser chrome and no Back button, so every screen
    // needs its own way back: the Back control, Escape, and the hardware/edge
    // swipe via a history entry.
    const showForgot = () => {
      loginScreen.hidden = true;
      forgotScreen.classList.add("active");
      root.scrollTop = 0;

      if (!forgotFrame.src) {
        frameWrap.classList.add("loading");
        forgotFrame.addEventListener("load", () => {
          frameWrap.classList.remove("loading");
        }, { once: true });
        forgotFrame.src = forgotPasswordUrl;
      }

      backButton.focus();
    };

    const showLogin = () => {
      forgotScreen.classList.remove("active");
      loginScreen.hidden = false;
      forgotPassword.focus();
    };

    forgotPassword.addEventListener("click", (event) => {
      event.preventDefault();
      history.pushState({ screen: "forgot" }, "");
      showForgot();
    });

    backButton.addEventListener("click", () => {
      if (history.state && history.state.screen === "forgot") {
        history.back();
      } else {
        showLogin();
      }
    });

    window.addEventListener("popstate", () => {
      if (forgotScreen.classList.contains("active")) {
        showLogin();
      }
    });

    togglePassword.addEventListener("click", () => {
      const reveal = passwordInput.type === "password";
      passwordInput.type = reveal ? "text" : "password";
      eyeIcon.innerHTML = reveal ? eyeClosed : eyeOpen;
      togglePassword.setAttribute("aria-label", reveal ? "Hide password" : "Show password");
      togglePassword.setAttribute("aria-pressed", reveal ? "true" : "false");
      passwordInput.focus({ preventScroll: true });
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && forgotScreen.classList.contains("active")) {
        backButton.click();
      }
    });
  </script>
</body>
</html>
